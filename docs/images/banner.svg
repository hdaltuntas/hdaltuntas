<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="l1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2f25"/><stop offset="1" stop-color="#2b231c"/>
    </linearGradient>
    <linearGradient id="l2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3b2c"/><stop offset="1" stop-color="#3a2f25"/>
    </linearGradient>
    <linearGradient id="l3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4733"/><stop offset="1" stop-color="#4a3b2c"/>
    </linearGradient>
    <pattern id="mesh" width="28" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 24 L14 0 L28 24 Z M14 0 L42 0" fill="none" stroke="#37BCF6" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#sky)"/>

  <!-- soil layers with a slope on the right -->
  <path d="M0 230 L820 230 L1010 150 L1280 150 L1280 320 L0 320 Z" fill="url(#l3)"/>
  <path d="M0 262 L1280 262 L1280 320 L0 320 Z" fill="url(#l2)"/>
  <path d="M0 292 L1280 292 L1280 320 L0 320 Z" fill="url(#l1)"/>
  <path d="M0 230 L820 230 L1010 150 L1280 150 L1280 320 L0 320 Z" fill="url(#mesh)"/>

  <!-- critical slip circle -->
  <path d="M790 230 A190 190 0 0 0 1060 150" fill="none" stroke="#F78166" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="905" y="300" fill="#F78166" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15">FS = 1.42</text>

  <!-- sheet pile wall -->
  <rect x="250" y="168" width="7" height="118" fill="#8b949e"/>
  <path d="M257 182 L300 182 L300 230 L257 260" fill="none" stroke="#37BCF6" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- pavement layers (left) -->
  <rect x="40" y="200" width="160" height="8" fill="#21262d"/>
  <rect x="40" y="208" width="160" height="10" fill="#30363d"/>
  <rect x="40" y="218" width="160" height="12" fill="#484f58"/>

  <!-- name & tagline -->
  <text x="640" y="88" text-anchor="middle" fill="#e6edf3" font-family="Georgia, 'Times New Roman', serif" font-size="52">Hasan Deniz Altuntaş</text>
  <text x="640" y="128" text-anchor="middle" fill="#37BCF6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" letter-spacing="3">GEOTECHNICAL ENGINEERING · FEM · PHYSICS-INFORMED ML</text>
</svg>
