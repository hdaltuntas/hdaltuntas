.dot{fill:#1c1b1a;stroke:#e08a68;stroke-width:2}
.pill{fill:#1c1b1a;stroke:rgba(217,212,202,.22);stroke-width:1}
.label{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:600;fill:#f3efe6}
.name{font-family:Newsreader,Georgia,'Times New Roman',serif;font-size:50px;fill:#f3efe6;letter-spacing:-1px}
.sub{font-family:Newsreader,Georgia,'Times New Roman',serif;font-size:24px;font-style:italic;fill:#e08a68}
